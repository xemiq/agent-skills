<rect x="1601" y="150" width="340" height="262" fill="#fafafa" stroke="#999999"/>
<text x="1609" y="169" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve"><tspan font-weight="bold">Legend (Chen notation)</tspan></text>
<text x="1609" y="182.8" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Rectangle: entity</text>
<text x="1609" y="196.5" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Double rectangle: weak entity</text>
<text x="1609" y="210.2" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Diamond: relationship</text>
<text x="1609" y="224" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Double diamond: identifying relationship</text>
<text x="1609" y="237.8" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Ellipse: attribute</text>
<text x="1609" y="251.5" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve"><tspan text-decoration="underline">Underlined</tspan>: key attribute</text>
<text x="1609" y="265.2" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Dashed underline: partial key</text>
<line x1="1609" y1="267.8" x2="1645.3" y2="267.8" stroke="#000000" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="1651.3" y1="267.8" x2="1705.8" y2="267.8" stroke="#000000" stroke-width="1" stroke-dasharray="3,2"/>
<text x="1609" y="279" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Double ellipse: multivalued attribute</text>
<text x="1609" y="292.8" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Dashed ellipse: derived attribute</text>
<text x="1609" y="306.5" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Ellipse with child ellipses: composite attribute</text>
<text x="1609" y="320.2" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Single line: partial (optional) participation</text>
<text x="1609" y="334" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Double line: total (mandatory) participation</text>
<text x="1609" y="347.8" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">1 / N / M next to an entity: cardinality of that</text>
<text x="1609" y="361.5" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">entity</text>
<text x="1609" y="375.2" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Pink note: constraint or business rule</text>
<text x="1609" y="389" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">Grey dashed rectangle: reference entity (attributes</text>
<text x="1609" y="402.8" font-size="11" fill="#000000" text-anchor="start" xml:space="preserve">on its home page)</text>
